name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar cargo-deb
        run: cargo install cargo-deb

      - name: Generar el paquete .deb
        run: cargo deb

      - name: Subir .deb al release
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb

  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar en modo release
        run: cargo build --release

      - name: Instalar NSIS
        shell: bash
        run: choco install nsis -y --no-progress

      - name: Generar el instalador
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION"
          # Pre-chequeo: el binario debe existir (lo genera `cargo build --release`).
          # Sin esto makensis falla con un críptico "File: ... failed".
          test -f target/release/ump.exe || { echo "::error::falta target/release/ump.exe"; ls -l target/release/; exit 1; }
          # Ruta absoluta: evita que ${__FILEDIR__} quede relativo si el .nsi
          # evoluciona a usarlo (mismo criterio que en umbral).
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            -DVERSION="${VERSION}" "${GITHUB_WORKSPACE}/windows/ump.nsi"

      - name: Subir instalador al release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/ump-setup-*.exe
