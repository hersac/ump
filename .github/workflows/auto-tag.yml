name: Auto Tag

# Cuando se mezclan cambios a main, lee la versión de Cargo.toml,
# crea el tag vX.Y.Z correspondiente (si no existe) y crea la
# release de producción. El push del tag dispara el workflow
# `Release` (.github/workflows/release.yml) que compila y sube
# los artefactos (.deb + instalador Windows).
#
# Flujo equivalente al versionado manual por tags de umbral
# (v1.5.5, v1.5.4, ...), pero automatizado.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con tags e historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Leer versión de Cargo.toml
        id: version
        run: |
          VERSION="$(grep -m1 '^version *=' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$VERSION" ]; then
            echo "::error::no se pudo leer la versión de Cargo.toml"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: ${VERSION} -> tag ${TAG}"

      - name: Crear tag y release si no existen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe, no se crea nada."
          else
            echo "Creando tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe."
          else
            echo "Creando release de producción $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
